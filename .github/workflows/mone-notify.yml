name: MONE Entry Proximity Notifier

on:
  workflow_dispatch:
    inputs:
      test_market:
        description: "테스트 발송 시장 (test_delivery=true일 때만 사용)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - kr
          - us
      test_delivery:
        description: "현재 시각과 관계없이 Telegram 전송만 검증"
        required: false
        default: false
        type: boolean
  schedule:
    # 국장/미장 개장 전 1회만 (장중 반복 알림 폐지). 시각 매칭은
    # scripts/notify_entry_proximity.py의 _is_kr_preopen()/_is_us_preopen()이 최종 판단한다.
    - cron: "30 23 * * 0-4"  # KST 08:30 (국장 개장 전)
    - cron: "0 13 * * 1-5"   # 미장 개장 전 09:00 ET (EDT 기준)
    - cron: "0 14 * * 1-5"   # 미장 개장 전 09:00 ET (EST 기준)

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: mone-notify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ENTRY_PROXIMITY_PCT: "2.0"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_APP_SECRET_KEY: ${{ secrets.KIS_APP_SECRET_KEY }}
      KIS_SECRET: ${{ secrets.KIS_SECRET }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_CANO: ${{ secrets.KIS_CANO }}
      KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
      KIS_IS_MOCK: ${{ secrets.KIS_IS_MOCK }}
      DISPATCH_TEST_MARKET: ${{ inputs.test_market || 'auto' }}
      DISPATCH_TEST_DELIVERY: ${{ inputs.test_delivery || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install "pandas>=2.2,<3" "numpy>=1.26,<3" requests python-dotenv
          fi

          # The briefing imports the same public recommendation policy as the API.
          python -m pip install "fastapi>=0.115,<1" "pandas_market_calendars>=5.3,<6"

      - name: Check which market's preopen window this run matches
        id: market_check
        run: |
          KR_HOUR=$(TZ=Asia/Seoul date +%H)
          if [ "$KR_HOUR" = "08" ]; then
            echo "kr_preopen=true" >> $GITHUB_OUTPUT
            echo "국장 개장 전 실행입니다 (KST $(TZ=Asia/Seoul date +%H:%M))"
          else
            echo "kr_preopen=false" >> $GITHUB_OUTPUT
            echo "국장 개장 전 시간이 아닙니다 (KST $(TZ=Asia/Seoul date +%H:%M)) — KIS 현재가 갱신 생략"
          fi

      - name: Refresh KIS live quotes
        if: steps.market_check.outputs.kr_preopen == 'true'
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
          STREAMLIT_APP_ENABLE_LIVE_API: "1"
          MONE_ENABLE_LIVE_QUOTES: "1"
        run: |
          set +e
          python - <<'PY'
          import os, re
          from pathlib import Path

          def adopt_env(primary, *aliases):
              if os.environ.get(primary): return
              for a in aliases:
                  v = os.environ.get(a)
                  if v:
                      os.environ[primary] = v; return

          adopt_env("KIS_APP_KEY", "KIS_APPKEY")
          adopt_env("KIS_APP_SECRET", "KIS_APP_SECRET_KEY", "KIS_SECRET")
          adopt_env("KIS_ACCOUNT", "KIS_ACCOUNT_NO")
          account = re.sub(r"\D", "", os.environ.get("KIS_ACCOUNT", ""))
          if account and not os.environ.get("KIS_CANO") and len(account) >= 8:
              os.environ["KIS_CANO"] = account[:8]
          if account and not os.environ.get("KIS_ACNT_PRDT_CD") and len(account) >= 10:
              os.environ["KIS_ACNT_PRDT_CD"] = account[8:10]

          from app.services import quotes
          repo = Path.cwd().parents[1]
          targets = []

          # 추천 종목에서 심볼 수집
          import csv
          for mode in ("conservative", "balanced", "aggressive"):
              for horizon in ("short", "swing", "mid"):
                  p = repo / "reports" / f"mone_v36_final_recommendations_kr_{mode}_{horizon}.csv"
                  if not p.exists(): continue
                  for enc in ("utf-8-sig", "utf-8", "cp949"):
                      try:
                          with p.open("r", encoding=enc) as f:
                              for row in csv.DictReader(f):
                                  s = str(row.get("symbol") or "").strip()
                                  if s and s not in targets:
                                      targets.append(s)
                          break
                      except: continue

          # 보유종목 심볼 추가
          hpath = repo / "holdings_kr.csv"
          if hpath.exists():
              for enc in ("utf-8-sig", "utf-8", "cp949"):
                  try:
                      with hpath.open("r", encoding=enc) as f:
                          for row in csv.DictReader(f):
                              s = str(row.get("symbol") or "").strip()
                              if s and s not in targets:
                                  targets.append(s)
                      break
                  except: continue

          print(f"현재가 수집 대상: {len(targets)}종목")
          results = quotes.fetch_quotes_bulk("kr", targets[:80])
          ok = sum(1 for r in results if r.get("ok"))
          print(f"수집 완료: {ok}/{len(results)}")
          PY
          echo "KIS quote refresh: exit $?"

      - name: Send pre-market prediction (국장 전 / 미장 전 각 1회)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: |
          KR_HOUR=$(TZ=Asia/Seoul date +%H)
          ET_HOUR=$(TZ=America/New_York date +%H)
          ET_ZONE=$(TZ=America/New_York date +%Z)
          SCHEDULE_EXPRESSION="${{ github.event.schedule }}"
          DELAY_NOTICE=""
          WEEKDAY=$(date +%u)
          if [ "$WEEKDAY" -ge 6 ]; then
            echo "주말 — 알림 스킵"
            exit 0
          fi
          case "${SCHEDULE_EXPRESSION}" in
            "30 23 * * 0-4")
              MARKET="kr"
              if [ "$KR_HOUR" != "08" ]; then
                DELAY_NOTICE="⚠️ 예약 지연 도착: KST ${KR_HOUR}시 기준 최신 데이터로 재계산한 브리핑입니다."
                echo "::warning::KR 장전 예약이 KST ${KR_HOUR}시에 늦게 실행되었습니다. 최신 브리핑을 계속 발송합니다."
              fi
              ;;
            "0 13 * * 1-5")
              # 13:00 UTC는 미국 서머타임(EDT) 전용이다. EST 기간에는 두 번째
              # 예약이 담당하므로 이 실행은 중복 발송 없이 정상 스킵한다.
              if [ "$ET_ZONE" != "EDT" ]; then
                echo "EDT 비활성 기간 — US 중복 알림 스킵"
                exit 0
              fi
              MARKET="us"
              if [ "$ET_HOUR" != "09" ]; then
                DELAY_NOTICE="⚠️ 예약 지연 도착: ET ${ET_HOUR}시 기준 최신 데이터로 재계산한 브리핑입니다."
                echo "::warning::US 장전 예약이 ET ${ET_HOUR}시에 늦게 실행되었습니다. 최신 브리핑을 계속 발송합니다."
              fi
              ;;
            "0 14 * * 1-5")
              # 14:00 UTC는 미국 표준시(EST) 전용이다.
              if [ "$ET_ZONE" != "EST" ]; then
                echo "EST 비활성 기간 — US 중복 알림 스킵"
                exit 0
              fi
              MARKET="us"
              if [ "$ET_HOUR" != "09" ]; then
                DELAY_NOTICE="⚠️ 예약 지연 도착: ET ${ET_HOUR}시 기준 최신 데이터로 재계산한 브리핑입니다."
                echo "::warning::US 장전 예약이 ET ${ET_HOUR}시에 늦게 실행되었습니다. 최신 브리핑을 계속 발송합니다."
              fi
              ;;
            "")
              if [ "${DISPATCH_TEST_DELIVERY}" = "true" ]; then
                case "${DISPATCH_TEST_MARKET}" in
                  kr|us) MARKET="${DISPATCH_TEST_MARKET}" ;;
                  *) echo "::error::전송 테스트에는 test_market=kr 또는 us가 필요합니다."; exit 1 ;;
                esac
                DELAY_NOTICE="🧪 Telegram 전송 테스트 — 현재 시각의 실제 매매 신호로 사용하지 마세요."
              # cron-job.org는 입력 없이 workflow_dispatch를 호출한다. 이 경우는 실제 장전
              # 시간에만 발송해 테스트 실행이 장중 알림으로 바뀌지 않게 한다.
              elif [ "$KR_HOUR" = "08" ]; then MARKET="kr";
              elif [ "$ET_HOUR" = "09" ]; then MARKET="us";
              else echo "::error::수동/외부 실행은 KR 08시 또는 US 09시(ET)에만 발송됩니다 (KST=${KR_HOUR}, ET=${ET_HOUR})."; exit 1; fi
              ;;
            *)
              echo "::error::알 수 없는 예약식: ${SCHEDULE_EXPRESSION}"
              exit 1
              ;;
          esac
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN 또는 TELEGRAM_CHAT_ID GitHub Secret이 비어 있습니다."
            exit 1
          fi
          echo "${MARKET} 장전 알림 발송 (KST=${KR_HOUR}, ET=${ET_HOUR}, schedule=${SCHEDULE_EXPRESSION:-manual})"
          MONE_NOTIFY_DELAY_NOTICE="${DELAY_NOTICE}" python scripts/notify_daily_summary.py --market "${MARKET}"

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID 미설정 — 알림 스킵"
            exit 0
          fi
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"⚠️ MONE Entry Proximity Notifier 실패\nrun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n진입 근접 알림이 전송되지 않았을 수 있습니다.\"}" \
            || echo "텔레그램 알림 전송 실패 (무시)"
