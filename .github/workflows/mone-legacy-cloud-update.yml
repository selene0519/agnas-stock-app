name: MONE Legacy Cloud Update

# mone-auto-accumulator에서 분리된 레거시 리포트 갱신.
#
# 배경: 이 스텝(`scripts/mone_github_auto_update.py`)이 **매번 25분을 통째로
# 쓰고 있었다.** 내부 `run_base_update()`의 `timeout=25*60`에 걸려 강제
# 종료되는 것이라(2026-07-27 실측 1501초 = 1500초 타임아웃 + 1초), 25분을
# 기다린 뒤 결과 없이 끝난다. 그런데 이게 accumulator의 첫 무거운 스텝이라
# 일일 파이프라인 예산 40분 중 25분을 먼저 먹고 시작했다.
#
# 격리 이유: 추천 생성·예측 캡처·정산 같은 **자가보정 루프의 핵심 경로**가
# 레거시 모놀리식(v36/v43/v44/v45/v50/v51… 체인)의 행에 인질로 잡히면 안 된다.
# 여기서 죽어도 일일 파이프라인은 정상적으로 완주한다.
#
# TODO: `run_cloud_accumulator.py`가 실제로 어떤 산출물을 만드는지, 그리고
# 25분 타임아웃에 잘린 부분 산출물이 앱에 쓰이는지 확인 후 축소/제거 검토.

on:
  workflow_dispatch:
  schedule:
    # KST 07:00 (일일 accumulator 07:30보다 먼저, 평일)
    - cron: "0 22 * * 0-4"

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: mone-legacy-cloud-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud-update:
    runs-on: ubuntu-latest
    # 내부 타임아웃 25분 + 설치/체크아웃/커밋 여유.
    timeout-minutes: 40
    env:
      CI: "true"
      GITHUB_ACTIONS_RUN: "true"
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      STREAMLIT_APP_ENABLE_LIVE_API: "1"
      MONE_ENABLE_LIVE_QUOTES: "1"
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pandas numpy requests python-dotenv yfinance finance-datareader beautifulsoup4 lxml
          fi

      - name: Run MONE cloud update
        run: |
          if [ -f scripts/mone_github_auto_update.py ]; then
            python scripts/mone_github_auto_update.py
          else
            echo "scripts/mone_github_auto_update.py not found; skip cloud update."
          fi

      - name: 내부 타임아웃 여부 표면화
        # 25분 내부 타임아웃에 걸려도 스크립트는 예외를 삼키고 정상 종료한다.
        # 그러면 "성공했지만 아무것도 안 한" 실행이 CI에서 green으로 보인다.
        run: |
          if [ -f logs/v93_base_update_error.log ]; then
            echo "::warning::base update가 예외로 끝났습니다 — 산출물이 부분적일 수 있습니다"
            head -c 800 logs/v93_base_update_error.log
          fi
          if grep -qi "timeout" logs/v93_base_update*.log 2>/dev/null; then
            echo "::warning::base update 로그에 timeout 흔적이 있습니다"
          fi

      - name: Remove local token/cache files before commit
        run: |
          rm -f data/kis_token_cache*.json reports/kis_token_cache*.json kis_token_cache*.json 2>/dev/null || true
          rm -f mone-web-app/backend/cache/*token_cache*.json 2>/dev/null || true

      - name: Commit generated data
        run: |
          bash scripts/ci_commit_app_data.sh "chore: legacy cloud update reports [skip ci]"

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID 미설정 — 알림 스킵"
            exit 0
          fi
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"⚠️ MONE Legacy Cloud Update 실패\nrun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            || echo "텔레그램 알림 전송 실패 (무시)"
