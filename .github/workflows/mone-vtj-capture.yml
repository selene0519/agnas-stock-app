name: MONE AI Journal Capture

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Capture market"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - kr
          - us
      journalSession:
        description: "AI journal session"
        required: false
        default: "AFTER_CLOSE_TRADE"
        type: choice
        options:
          - PREMARKET_PLAN
          - AFTER_CLOSE_TRADE
  schedule:
    # UTC based. Duplicate runs are blocked server-side by market/date/session runKey.
    - cron: "20 23 * * 0-4"   # KST 08:20 Mon-Fri, KR premarket plan
    - cron: "50 7 * * 1-5"    # KST 16:50, KR close capture
    - cron: "30 8 * * 1-5"    # KST 17:30, KR retry after reports settle
    - cron: "30 12 * * 1-5"   # KST 21:30, US premarket plan
    - cron: "20 22 * * 1-5"   # KST 07:20 Tue-Sat, US close capture
    - cron: "0 23 * * 1-5"    # KST 08:00 Tue-Sat, US retry after reports settle

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: mone-ledger-writer-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      DISPATCH_MARKET: ${{ github.event.inputs.market || 'all' }}
      DISPATCH_SESSION: ${{ github.event.inputs.journalSession || 'AFTER_CLOSE_TRADE' }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install journal runtime
        run: |
          python -m pip install --disable-pip-version-check \
            "pandas>=2.2,<3" "numpy>=1.26,<3" "pandas_market_calendars>=5.3,<6" requests python-dotenv

      - name: Capture AI journal session
        id: capture
        run: |
          MARKET="${DISPATCH_MARKET:-all}"
          JOURNAL_SESSION="${DISPATCH_SESSION:-AFTER_CLOSE_TRADE}"

          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            KST_HOUR="$(TZ=Asia/Seoul date '+%H')"
            case "${SCHEDULE_EXPRESSION}" in
              "20 23 * * 0-4") MARKET="kr"; JOURNAL_SESSION="PREMARKET_PLAN"; [[ "$KST_HOUR" = "08" ]] || { echo "::warning::Scheduled KR premarket capture arrived outside its safe window; capture skipped"; echo "scheduled_skip=true" >> "$GITHUB_OUTPUT"; exit 0; } ;;
              "50 7 * * 1-5"|"30 8 * * 1-5") MARKET="kr"; JOURNAL_SESSION="AFTER_CLOSE_TRADE"; [[ "$KST_HOUR" =~ ^(16|17|18|19|20|21|22|23)$ ]] || { echo "::warning::Scheduled KR close capture arrived outside its safe window; capture skipped"; echo "scheduled_skip=true" >> "$GITHUB_OUTPUT"; exit 0; } ;;
              "30 12 * * 1-5") MARKET="us"; JOURNAL_SESSION="PREMARKET_PLAN"; [[ "$KST_HOUR" = "21" ]] || { echo "::warning::Scheduled US premarket capture arrived outside its safe window; capture skipped"; echo "scheduled_skip=true" >> "$GITHUB_OUTPUT"; exit 0; } ;;
              "20 22 * * 1-5"|"0 23 * * 1-5") MARKET="us"; JOURNAL_SESSION="AFTER_CLOSE_TRADE"; [[ "$KST_HOUR" =~ ^(07|08|09|10|11|12|13|14|15)$ ]] || { echo "::warning::Scheduled US close capture arrived outside its safe window; capture skipped"; echo "scheduled_skip=true" >> "$GITHUB_OUTPUT"; exit 0; } ;;
              *) echo "::error::Unknown schedule; refusing an ambiguous capture"; exit 1 ;;
            esac
          fi

          echo "AI journal capture request"
          echo "market=${MARKET}"
          echo "journal_session=${JOURNAL_SESSION}"
          echo "kst_now=$(date '+%Y-%m-%d %H:%M:%S %Z')"

          EVALUATE_AFTER="true"
          if [ "${JOURNAL_SESSION}" = "PREMARKET_PLAN" ]; then
            EVALUATE_AFTER="false"
          fi

          MARKET="$MARKET" JOURNAL_SESSION="$JOURNAL_SESSION" EVALUATE_AFTER="$EVALUATE_AFTER" python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "mone-web-app" / "backend"))
          from app.services import virtual_trade_journal as vtj

          result = vtj.run_auto_capture(
              market=os.environ["MARKET"],
              journal_session=os.environ["JOURNAL_SESSION"],
              limit=5,
              include_engine=False,
              evaluate_after=os.environ["EVALUATE_AFTER"].lower() == "true",
              force=False,
              source="github-actions",
          )
          Path("/tmp/ai_journal_result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

          cat /tmp/ai_journal_result.json

      - name: Validate capture result
        id: validate
        if: steps.capture.outputs.scheduled_skip != 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("/tmp/ai_journal_result.json").read_text(encoding="utf-8"))
          if str(payload.get("status", "")).upper() != "OK":
              print(f"::error::capture status={payload.get('status')} error={payload.get('error', '')}")
              raise SystemExit(1)
          runs = payload.get("runs") if isinstance(payload.get("runs"), list) else []
          bad = [run for run in runs if str(run.get("status", "")).upper() in {"ERROR", "FAILED"}]
          if bad:
              print(f"::error::capture run failures={bad}")
              raise SystemExit(1)
          added = sum(int(run.get("added") or 0) for run in runs)
          selected = sum(int(run.get("selected") or 0) for run in runs)
          activity = "CAPTURED"
          if not runs:
              activity = "NO_RUNS"
          elif added == 0 and (
              any(str(run.get("status", "")).upper() == "SKIPPED_DUPLICATE" for run in runs)
              or any(int(item.get("duplicates") or 0) > 0 for run in runs for item in (run.get("items") or []))
          ):
              activity = "ALREADY_RECORDED"
          elif added == 0 and any(str(run.get("status", "")).upper() == "NO_CANDIDATES" for run in runs):
              activity = "NO_CANDIDATES"
          elif added == 0:
              activity = "NO_NEW_ROWS"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
              fp.write(f"capture_activity={activity}\n")
              fp.write(f"added={added}\n")
              fp.write(f"selected={selected}\n")
          print(f"capture_activity={activity} selected={selected} added={added}")
          if activity == "NO_CANDIDATES":
              print("::notice::capture pipeline is healthy; no recommendation passed the current quality gates")
          elif activity == "NO_RUNS":
              print("::error::capture response did not include run diagnostics")
              raise SystemExit(1)
          PY

      - name: Commit durable journal ledger
        if: steps.capture.outputs.scheduled_skip != 'true'
        run: |
          if git diff --quiet -- data/virtual_trade_journal.csv data/virtual_trade_evaluations.csv reports/virtual_trade_journal_status.json; then
            echo "No journal ledger changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/virtual_trade_journal.csv data/virtual_trade_evaluations.csv reports/virtual_trade_journal_status.json
          git commit -m "chore(journal): persist scheduled capture [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID 미설정 — 알림 스킵"
            exit 0
          fi
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"⚠️ MONE AI Journal Capture 실패\nrun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nAI 매매일지 캡처가 기록되지 않았을 수 있습니다.\"}" \
            || echo "텔레그램 알림 전송 실패 (무시)"
