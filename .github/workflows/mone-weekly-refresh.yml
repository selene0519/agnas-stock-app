name: MONE Weekly Refresh

# mone-auto-accumulator에서 분리된 주간 무거운 작업.
#
# 배경: accumulator는 평일에도 40분(60분 한도의 68%)을 쓰는데, 월요일에
# 주간 스텝이 얹히면 넘쳤다. 2026-07-26~27 실측으로 6회 연속 60분 타임아웃
# (앙상블 보정만 19분+ 돌다 강제 종료). 주간 작업을 여기로 옮겨 일일
# 파이프라인이 주 1회 때문에 통째로 죽지 않게 한다.
#
# 여기 스텝들은 월요일 cron으로만 도므로 예전의 `date +%u` 내부 게이트는
# 제거했다 — 남겨두면 수동 실행(workflow_dispatch)이 항상 스킵된다.

on:
  workflow_dispatch:
  schedule:
    # KST 월요일 06:00 (장전, 일일 accumulator 07:30보다 먼저)
    - cron: "0 21 * * 0"

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: mone-weekly-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      GITHUB_ACTIONS_RUN: "true"
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pandas numpy requests python-dotenv yfinance finance-datareader beautifulsoup4 lxml
          fi

      - name: Fetch DART financials
        run: |
          set +e
          if [ -f scripts/fetch_dart_financials.py ]; then
            python scripts/fetch_dart_financials.py
            echo "fetch_dart_financials: exit $?"
          else
            echo "scripts/fetch_dart_financials.py not found; skip."
          fi
          set -e

      - name: Fetch KR financial data via yfinance
        run: |
          set +e
          if [ -f scripts/fetch_kr_financial_data.py ]; then
            python scripts/fetch_kr_financial_data.py
            echo "fetch_kr_financial_data: exit $?"
          else
            echo "scripts/fetch_kr_financial_data.py not found; skip."
          fi
          set -e

      - name: Fetch sector data
        run: |
          set +e
          if [ -f scripts/fetch_sector_data.py ]; then
            python scripts/fetch_sector_data.py
            echo "fetch_sector_data: exit $?"
          else
            echo "scripts/fetch_sector_data.py not found; skip."
          fi
          set -e

      - name: Expand candidate universe — 시총+거래대금
        run: |
          set +e
          if [ -f scripts/build_universe.py ]; then
            python scripts/build_universe.py --market all
            echo "build_universe: exit $?"
          else
            echo "scripts/build_universe.py not found; skip."
          fi
          set -e

      - name: 앙상블 보정 (walk-forward)
        # accumulator에서 19분+ 돌다 타임아웃에 잘리던 스텝. 여기서는 끝까지 돈다.
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.engine.ensemble_calibrator import run_ensemble_calibration
          for market in ("kr", "us"):
              result = run_ensemble_calibration(market=market)
              combos = len(result.get("combos", []))
              print(json.dumps(result, ensure_ascii=False, indent=2))
              print(f"앙상블 보정 [{market}]: {combos}개 콤보 저장됨")
          PY
          echo "ensemble calibration: exit $?"
          set -e

      - name: Remove local token/cache files before commit
        run: |
          rm -f data/kis_token_cache*.json reports/kis_token_cache*.json kis_token_cache*.json 2>/dev/null || true
          rm -f mone-web-app/backend/cache/*token_cache*.json 2>/dev/null || true

      - name: Commit generated data
        run: |
          bash scripts/ci_commit_app_data.sh "chore: weekly refresh (financials/universe/ensemble) [skip ci]"

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID 미설정 — 알림 스킵"
            exit 0
          fi
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"⚠️ MONE Weekly Refresh 실패\nrun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n재무/섹터/유니버스/앙상블 보정이 갱신되지 않았습니다.\"}" \
            || echo "텔레그램 알림 전송 실패 (무시)"
