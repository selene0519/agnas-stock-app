name: MONE Auto Accumulator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - reports/.auto-accumulator-rerun
  schedule:
    # UTC 기준. KST 07:30 (장전) / 16:30 (국장 마감 후) / 토 06:00 (미장 금요일 마감 후)
    - cron: "30 22 * * 0-4"   # KST 07:30 (장전 데이터 수집, 월~금)
    - cron: "30 7 * * 1-5"    # KST 16:30 (국장 마감 후 수집, 월~금)
    - cron: "0 21 * * 5"      # KST 토 06:00 (미장 금요일 마감 후 수집)

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: mone-auto-accumulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 분할 후 실측 15.6분(레거시 cloud update 25분과 월요일 주간 작업을
    # 각각 mone-legacy-cloud-update / mone-weekly-refresh로 분리).
    # 3배 여유만 두어 행(hang)이 60분을 다 태우기 전에 드러나게 한다.
    timeout-minutes: 45
    env:
      CI: "true"
      GITHUB_ACTIONS_RUN: "true"
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      STREAMLIT_APP_ENABLE_LIVE_API: "1"
      MONE_ENABLE_LIVE_QUOTES: "1"
      # Advisory parameters become active only when their embedded immutable
      # Forward promotion certificate passes every lineage and risk gate.
      # This never enables broker orders.
      SELF_CORRECTION_ENABLED: "true"
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_APP_SECRET_KEY: ${{ secrets.KIS_APP_SECRET_KEY }}
      KIS_SECRET: ${{ secrets.KIS_SECRET }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_CANO: ${{ secrets.KIS_CANO }}
      KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
      KIS_IS_MOCK: ${{ secrets.KIS_IS_MOCK }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install "pandas>=2.2,<3" "numpy>=1.26,<3" requests python-dotenv yfinance finance-datareader beautifulsoup4 lxml
          fi
          # 이 워크플로의 여러 스텝이 백엔드 모듈을 직접 임포트한다
          # (예측 캡처는 mone_v65_api_stabilizer를 부르는데 그게 fastapi를 import 한다).
          # 루트 requirements.txt에는 fastapi가 없어서 캡처가 CI에서만
          # ModuleNotFoundError로 죽었다 — 로컬엔 설치돼 있어 안 보였다.
          if [ -f mone-web-app/backend/requirements.txt ]; then
            python -m pip install -r mone-web-app/backend/requirements.txt
          fi

      - name: Refresh live KIS quotes
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          if [ "${STREAMLIT_APP_ENABLE_LIVE_API:-0}" != "1" ]; then
            echo "STREAMLIT_APP_ENABLE_LIVE_API is not 1; skip live quote refresh."
            exit 0
          fi

          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import csv
          import json
          import os
          import re
          from datetime import datetime

          from app.services import quotes

          repo_root = Path.cwd().parents[1]
          reports = repo_root / "reports"
          stockapp = repo_root / "data" / "stockapp"
          reports.mkdir(parents=True, exist_ok=True)
          stockapp.mkdir(parents=True, exist_ok=True)

          def adopt_env(primary: str, *aliases: str) -> None:
              if os.environ.get(primary):
                  return
              for alias in aliases:
                  value = os.environ.get(alias)
                  if value:
                      os.environ[primary] = value
                      return

          adopt_env("KIS_APP_KEY", "KIS_APPKEY")
          adopt_env("KIS_APP_SECRET", "KIS_APP_SECRET_KEY", "KIS_SECRET")
          adopt_env("KIS_ACCOUNT", "KIS_ACCOUNT_NO")

          account = re.sub(r"\D", "", os.environ.get("KIS_ACCOUNT", ""))
          if account and not os.environ.get("KIS_CANO") and len(account) >= 8:
              os.environ["KIS_CANO"] = account[:8]
          if account and not os.environ.get("KIS_ACNT_PRDT_CD") and len(account) >= 10:
              os.environ["KIS_ACNT_PRDT_CD"] = account[8:10]

          env_status = {
              "KIS_APP_KEY": bool(os.environ.get("KIS_APP_KEY")),
              "KIS_APP_SECRET": bool(os.environ.get("KIS_APP_SECRET")),
              "KIS_ACCOUNT": bool(os.environ.get("KIS_ACCOUNT")),
              "KIS_CANO": bool(os.environ.get("KIS_CANO")),
              "KIS_ACNT_PRDT_CD": bool(os.environ.get("KIS_ACNT_PRDT_CD")),
              "KIS_IS_MOCK": os.environ.get("KIS_IS_MOCK", ""),
          }
          print({"kis_env_present": env_status})

          fieldnames = [
              "symbol", "market", "ok", "currentPrice", "current_price", "last_price",
              "priceTime", "priceSource", "source", "priceSourceType", "priceSourceFile",
              "priceSourceDate", "kis_quote_success", "quote_available", "error", "updated_at",
              "prevClose", "changePct",
          ]

          def empty_csv(target: Path) -> None:
              target.parent.mkdir(parents=True, exist_ok=True)
              with target.open("w", newline="", encoding="utf-8-sig") as fh:
                  writer = csv.DictWriter(fh, fieldnames=fieldnames)
                  writer.writeheader()

          def source_type(item: dict) -> str:
              source_text = " ".join(str(item.get(k, "")) for k in ("priceSource", "source", "fallbackFrom"))
              source_lower = source_text.lower()
              ok = bool(item.get("ok"))
              if ok and "kis" in source_lower and "fallback" not in source_lower:
                  return "kis_snapshot"
              if ok and "finnhub" in source_lower:
                  return "finnhub_fallback"
              if ok and "yfinance" in source_lower:
                  return "yfinance_fallback"
              if ok:
                  return "quote_fallback"
              return "quote_failed"

          def build_rows(market: str, result: dict, only_kis: bool) -> list[dict]:
              rows = []
              for item in result.get("items", []) or []:
                  stype = source_type(item)
                  if only_kis and stype != "kis_snapshot":
                      continue
                  price = item.get("currentPrice")
                  ok = bool(item.get("ok")) and price not in (None, "")
                  price_source = item.get("priceSource") or item.get("source") or "KIS current price"
                  price_time = item.get("priceTime") or result.get("updatedAt", "")
                  prev_close = item.get("prevClose")
                  change_pct = item.get("changePct")
                  rows.append({
                      "symbol": item.get("symbol", ""),
                      "market": market,
                      "ok": str(ok).lower(),
                      "currentPrice": price if ok else "",
                      "current_price": price if ok else "",
                      "last_price": price if ok else "",
                      "priceTime": price_time,
                      "priceSource": price_source,
                      "source": price_source,
                      "priceSourceType": stype,
                      "priceSourceFile": f"reports/kis_current_price_{market}.csv" if stype == "kis_snapshot" else f"reports/intraday_realtime_snapshot_{market}.csv",
                      "priceSourceDate": price_time,
                      "kis_quote_success": "true" if stype == "kis_snapshot" else "false",
                      "quote_available": "true" if ok else "false",
                      "error": item.get("error", ""),
                      "updated_at": result.get("updatedAt", ""),
                      "prevClose": prev_close if prev_close is not None else "",
                      "changePct": change_pct if change_pct is not None else "",
                  })
              return rows

          def write_rows(targets: list[Path], rows: list[dict]) -> None:
              for target in targets:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with target.open("w", newline="", encoding="utf-8-sig") as fh:
                      writer = csv.DictWriter(fh, fieldnames=fieldnames)
                      writer.writeheader()
                      writer.writerows(rows)

          has_kis_config = env_status["KIS_APP_KEY"] and env_status["KIS_APP_SECRET"]
          status_summary = {
              "updatedAt": datetime.now().strftime("%Y-%m-%d %H:%M:%S KST"),
              "envPresent": env_status,
              "markets": {},
          }

          for market in ("kr", "us"):
              kis_targets = [
                  reports / f"kis_current_price_{market}.csv",
                  stockapp / f"kis_current_price_{market}.csv",
              ]
              all_targets = [
                  reports / f"intraday_realtime_snapshot_{market}.csv",
                  reports / f"intraday_quote_snapshot_{market}.csv",
                  stockapp / f"intraday_realtime_snapshot_{market}.csv",
                  stockapp / f"intraday_quote_snapshot_{market}.csv",
              ]

              if not has_kis_config:
                  for target in kis_targets + all_targets:
                      empty_csv(target)
                  status_summary["markets"][market] = {
                      "status": "MISSING_KIS_SECRET",
                      "refreshed": 0,
                      "failed": 0,
                      "kisRows": 0,
                      "fallbackRows": 0,
                      "message": "KIS_APP_KEY/KIS_APP_SECRET are not available in GitHub Actions secrets.",
                  }
                  print({"market": market, "status": "MISSING_KIS_SECRET", "refreshed": 0, "failed": 0})
                  continue

              result = quotes.refresh_quotes(market=market, max_symbols=150)
              kis_rows = build_rows(market, result, only_kis=True)
              all_rows = build_rows(market, result, only_kis=False)
              write_rows(kis_targets, kis_rows)
              write_rows(all_targets, all_rows)

              status_summary["markets"][market] = {
                  "status": result.get("status"),
                  "refreshed": result.get("refreshed"),
                  "failed": result.get("failed"),
                  "kisRows": len(kis_rows),
                  "fallbackRows": max(0, len(all_rows) - len(kis_rows)),
                  "failedItems": [
                      {
                          "symbol": item.get("symbol", ""),
                          "error": item.get("error", ""),
                          "fallbackKept": bool(item.get("fallbackKept")),
                      }
                      for item in result.get("failedItems", [])
                  ],
                  "updatedAt": result.get("updatedAt"),
              }
              print({
                  "market": market,
                  "status": result.get("status"),
                  "refreshed": result.get("refreshed"),
                  "failed": result.get("failed"),
                  "kisRows": len(kis_rows),
                  "fallbackRows": max(0, len(all_rows) - len(kis_rows)),
                  "failedItems": [
                      {
                          "symbol": item.get("symbol", ""),
                          "error": item.get("error", ""),
                          "fallbackKept": bool(item.get("fallbackKept")),
                      }
                      for item in result.get("failedItems", [])
                  ],
                  "updatedAt": result.get("updatedAt"),
              })

          market_statuses = {
              str(item.get("status") or "UNKNOWN").upper()
              for item in status_summary["markets"].values()
          }
          status_summary["status"] = "OK" if market_statuses and market_statuses <= {"OK"} else "PARTIAL"

          (reports / "kis_live_refresh_status.json").write_text(
              json.dumps(status_summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Migrate large virtual operation ledgers
        run: python scripts/migrate_virtual_operation_history.py --remove-source

      - name: Record virtual operation history
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          if [ -f record_operation_history.py ]; then
            python record_operation_history.py --market all --modes all --source github-actions --backfill-existing
          else
            echo "record_operation_history.py not found; skip history record."
          fi

      - name: Generate MONE v3.6.1 operational reports
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          export PYTHONPATH="$PWD:${PYTHONPATH:-}"
          python operational_check.py
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "warning: operational_check.py returned $status; keep workflow running so generated data can still be committed."
          fi


      - name: Refresh GNews news (매일 장전/장후)
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          set +e
          python - <<'PY'
          import os, json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.services import data_loader as data
          key = os.environ.get("GNEWS_API_KEY", "")
          if not key:
              print("GNEWS_API_KEY 없음 — 뉴스 수집 건너뜀")
              exit(0)
          result = data.collect_gnews("all")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          for r in result.get("results", []):
              print(f"  [{r['market']}] {r.get('status')} {r.get('count',0)}건 → {r.get('file','')}")
          PY
          echo "gnews refresh: exit $?"
          set -e

      - name: Refresh DART disclosures (매일)
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set +e
          python - <<'PY'
          import os, json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.services import data_loader as data
          key = os.environ.get("DART_API_KEY", "")
          if not key:
              print("DART_API_KEY 없음 — 공시 수집 건너뜀")
              exit(0)
          result = data.refresh_disclosures(market="all", days=7)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          for r in result.get("results", []):
              print(f"  [{r.get('market','?')}] {r.get('count',0)}건 → {r.get('file','')}")
          PY
          echo "dart refresh: exit $?"
          set -e

      - name: Refresh biotech official evidence (research-only)
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/collect_biotech_evidence.py --max-symbols 30
      - name: News sentiment cache 갱신 (공시+뉴스 → 종목별 감성 점수)
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.engine.news_sentiment_engine import build_sentiment_cache
          for mk in ("kr", "us"):
              result = build_sentiment_cache(mk)
              cnt = result.get("count", 0)
              print(f"[sentiment-cache/{mk}] {cnt}개 종목 감성 캐시 갱신")
          PY
          echo "sentiment-cache: exit $?"
          set -e

      - name: Ping backend API (배포 서버가 있으면 캐시 갱신)
        env:
          MONE_BACKEND_URL: ${{ secrets.MONE_BACKEND_URL || 'https://agnas-stock-app.onrender.com' }}
          ENABLE_BACKEND_NEWS_REFRESH: ${{ vars.ENABLE_BACKEND_NEWS_REFRESH || '0' }}
        run: |
          if [ -z "${MONE_BACKEND_URL}" ]; then
            echo "MONE_BACKEND_URL 미설정 — 백엔드 ping 건너뜀"
            exit 0
          fi
          BASE="${MONE_BACKEND_URL%/}"
          echo "백엔드 ping: ${BASE}"
          set +e
          if [ "${ENABLE_BACKEND_NEWS_REFRESH}" = "1" ]; then
            curl -sf -X POST "${BASE}/api/news/refresh?market=all" \
              -H "Content-Type: application/json" --max-time 30 \
              -o /tmp/news_refresh.json && cat /tmp/news_refresh.json || true
          else
            echo "backend news refresh skipped to conserve GNews quota"
          fi
          curl -sf -X POST "${BASE}/api/disclosures/refresh?market=all" \
            -H "Content-Type: application/json" --max-time 60 \
            -o /tmp/disc_refresh.json && cat /tmp/disc_refresh.json || true
          curl -sf -X POST "${BASE}/api/quotes/refresh-targets" \
            -H "Content-Type: application/json" --max-time 30 || true
          set -e
          echo "백엔드 ping 완료"

      - name: Backfill OHLCV history for DATA_PENDING stocks
        run: |
          set +e
          if [ -f scripts/backfill_ohlcv_history.py ]; then
            python scripts/backfill_ohlcv_history.py --min-rows 30 --days 120
            echo "backfill_ohlcv_history: exit $?"
          else
            echo "scripts/backfill_ohlcv_history.py not found; skip backfill."
          fi
          set -e

      - name: Refresh KR institutional/foreign supply flow (KIS)
        run: |
          set +e
          if [ -f scripts/refresh_kr_supply_flow.py ]; then
            python scripts/refresh_kr_supply_flow.py
            echo "refresh_kr_supply_flow: exit $?"
          else
            echo "scripts/refresh_kr_supply_flow.py not found; skip."
          fi
          set -e

      - name: Refresh KR administrative-issue/SPAC/caution listing status
        run: |
          set +e
          if [ -f scripts/refresh_kr_listing_status.py ]; then
            python scripts/refresh_kr_listing_status.py
            echo "refresh_kr_listing_status: exit $?"
          else
            echo "scripts/refresh_kr_listing_status.py not found; skip."
          fi
          set -e

      - name: VTJ post-promotion capital guard
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.services import virtual_trade_journal as vtj
          # This runs before recommendation generation. Only the currently
          # active, integrity-sealed correction can roll back; a failed
          # rollback quarantines that correction before it can affect capital.
          result = vtj.calibration_performance_gate(market="all", auto_rollback=True)
          print("[vtj-post-promotion-capital-guard]")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if result.get("status") in {"ROLLBACK_READY", "DEGRADED_BLOCKED"}:
              raise SystemExit(2)
          if result.get("candidateCount", 0) and not result.get("capitalBlocked"):
              raise SystemExit(3)
          PY
          code=$?
          set -e
          echo "vtj-post-promotion-capital-guard: exit ${code}"
          if [ "${code}" != "0" ]; then
            echo "::error::Post-promotion capital guard could not establish a safe correction state"
            exit "${code}"
          fi

      - name: Generate KR recommendations from OHLCV
        run: |
          set +e
          if [ -f scripts/refresh_kr_close_ohlcv.py ]; then
            python scripts/refresh_kr_close_ohlcv.py
            echo "refresh_kr_close_ohlcv: exit $?"
          else
            echo "scripts/refresh_kr_close_ohlcv.py not found; skip KR OHLCV refresh."
          fi
          python scripts/generate_kr_recommendations.py
          echo "generate_kr_recommendations: exit $?"
          set -e

      # KR 예측 알림은 mone-notify.yml (국장 장전 08:30 KST)에서 단독 1회 발송

      - name: Refresh US close OHLCV (장마감 후 / 금요일 마감)
        run: |
          set +e
          if [ -f scripts/refresh_us_close_ohlcv.py ]; then
            python scripts/refresh_us_close_ohlcv.py
            echo "refresh_us_close_ohlcv: exit $?"
          else
            echo "scripts/refresh_us_close_ohlcv.py not found; skip US OHLCV refresh."
          fi
          set -e

      - name: Generate US recommendations from OHLCV
        run: |
          set +e
          if [ -f scripts/generate_us_recommendations.py ]; then
            python scripts/generate_us_recommendations.py
            echo "generate_us_recommendations: exit $?"
          else
            echo "scripts/generate_us_recommendations.py not found; skip."
          fi
          set -e

      - name: Seal residual-alpha predictions immediately
        # This must run in the recommendation-producing workflow. The later
        # settlement workflow is allowed to settle labels, but must never
        # backfill an old recommendation as if it were a live prediction.
        run: |
          RECORD_MARKET="all"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            KST_HOUR="$(TZ=Asia/Seoul date '+%H')"
            case "${KST_HOUR}" in
              07) RECORD_MARKET="us" ;;  # latest completed US close
              16) RECORD_MARKET="kr" ;;  # latest completed KR close
              06) RECORD_MARKET="us" ;;  # Saturday US Friday close
              *) RECORD_MARKET="none" ;;
            esac
          fi
          set +e
          python scripts/build_shadow_residual_alpha.py --record-market "${RECORD_MARKET}"
          code=$?
          set -e
          echo "build_shadow_residual_alpha(${RECORD_MARKET}): exit ${code}"
          if [ "${code}" != "0" ]; then
            echo "::error::Forward residual-alpha prediction sealing failed (exit ${code})"
            exit "${code}"
          fi

      - name: Seal self-correction challenger inputs immediately
        # Candidate rows require the raw recommendation input contract and an
        # OHLCV cutoff equal to the signal date. Settlement jobs must never
        # backfill these predictions after future bars exist.
        run: |
          RECORD_MARKET="all"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            KST_HOUR="$(TZ=Asia/Seoul date '+%H')"
            case "${KST_HOUR}" in
              07) RECORD_MARKET="us" ;;  # latest completed US close
              16) RECORD_MARKET="kr" ;;  # latest completed KR close
              06) RECORD_MARKET="us" ;;  # Saturday US Friday close
              *) RECORD_MARKET="none" ;;
            esac
          fi
          set +e
          python scripts/update_self_correction_shadow.py --no-settle --record-market "${RECORD_MARKET}"
          code=$?
          set -e
          echo "update_self_correction_shadow(record=${RECORD_MARKET}): exit ${code}"
          if [ "${code}" != "0" ]; then
            echo "::error::Self-correction forward prediction sealing failed (exit ${code})"
            exit "${code}"
          fi

      - name: Rebuild regime lens self-calibration (KR)
        # forward 루프: settle(만기정산) → journal(백테prior) → calibration(라이브+prior 블렌드)
        #             → screen(오늘후보) → capture(오늘후보를 예측원장에 기록)
        run: |
          set +e
          python scripts/archive_catalyst_history_kr.py
          if [ -f scripts/build_lens_journal_kr.py ]; then
            python scripts/settle_lens_predictions_kr.py
            python scripts/promote_lens_setups_kr.py
            python scripts/build_lens_journal_kr.py
            python scripts/build_lens_calibration_kr.py
            python scripts/screen_regime_lens_kr.py
            python scripts/scan_leader_breakout_kr.py
            python scripts/scan_relative_strength_kr.py
            python scripts/capture_leader_breakout_predictions.py
            python scripts/refresh_kr_lens_intraday_context.py
            python scripts/capture_lens_predictions_kr.py
            echo "regime lens loop: exit $?"
          fi
          if [ -f scripts/build_smart_rank_kr.py ]; then
            python scripts/build_smart_rank_kr.py
            echo "smart rank: exit $?"
          fi
          if [ -f scripts/build_high_conviction_kr.py ]; then
            python scripts/settle_high_conviction_kr.py
            python scripts/build_high_conviction_kr.py
            python scripts/capture_high_conviction_kr.py
            echo "high conviction forward loop: exit $?"
          else
            echo "lens scripts not found; skip."
          fi
          set -e

      # US 예측 알림은 mone-notify.yml (미장 장전 09:00 ET)에서 단독 1회 발송

      - name: 추천 예측 원장 캡처 (자가보정 루프 입력)
        # 원래 _record_virtual_ledger는 /api/final/recommendations 핸들러 안에서만
        # 불렸다 = 캡처가 "누가 앱을 열어야" 일어나는 요청 시간 부작용. 배포 백엔드는
        # 디스크가 휘발성이라 git에 남지도 않아, 6월 818건 → 7월 21건으로 원장이
        # 사실상 죽었고 clean window 표본이 0건이었다. 여기서 스케줄로 돌려
        # "시간이 지나면 표본이 쌓인다"는 전제를 복구한다.
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python ../../scripts/capture_recommendation_predictions.py --market all
          code=$?
          set -e
          echo "capture_recommendation_predictions: exit ${code}"
          # `set +e`만 두면 이 스텝이 죽어도 워크플로가 green으로 지나간다.
          # 실제로 2026-07-28까지 매 실행 ModuleNotFoundError로 죽고 있었는데
          # 아무도 몰랐다(원장이 7-23에 멈춘 걸 헬스체크가 잡아서야 발견).
          # 자가보정 루프의 입력이므로 최소한 눈에는 띄게 한다.
          if [ "${code}" != "0" ]; then
            echo "::error::예측 캡처 실패(exit ${code}) — 자가보정 루프에 새 표본이 쌓이지 않습니다"
          fi

      - name: Refresh KR/US close validations
        # 파일명은 kr만 가리키지만 KR+US 둘 다 생성함 (US 누락이 settle_pending_validations.py가
        # US 예측을 영영 EXPIRED로만 종결시키던 원인이었음 — _build_validation_index가 찾는
        # 날짜 스냅샷 trade_validation_us_*.csv가 한 번도 생성된 적이 없었음).
        run: |
          set +e
          if [ -f scripts/generate_kr_close_validation.py ]; then
            python scripts/generate_kr_close_validation.py
            echo "generate_kr_close_validation: exit $?"
          else
            echo "scripts/generate_kr_close_validation.py not found; skip."
          fi
          set -e

      - name: Fetch benchmark index data (daily)
        run: |
          set +e
          # Was gated to Monday-only, which left kr_KOSPI_daily.csv/kr_KOSDAQ_daily.csv
          # up to 6 days stale — market regime detection (BEAR/BULL/SIDE, MA20/momentum5d)
          # reads this file directly, so a weekly cadence meant regime could be wrong
          # for most of the week. This workflow already runs twice on weekdays, so run
          # the fetch every time instead.
          if [ -f scripts/fetch_benchmark_data.py ]; then
            python scripts/fetch_benchmark_data.py
            echo "fetch_benchmark_data: exit $?"
          else
            echo "scripts/fetch_benchmark_data.py not found; skip."
          fi
          set -e

      - name: Update portfolio NAV snapshot (누적수익률)
        # OHLCV·현재가·벤치마크 갱신 이후에 실행해야 오늘 NAV가 최신가로 잡힌다.
        # 예전엔 어느 워크플로에서도 호출되지 않아 portfolio_daily_nav.csv가 멈춰
        # 앱 누적수익률이 갱신되지 않았다. 보유수량 sync는 로컬 브릿지 담당이고,
        # 이 단계는 그 보유에 최신 종가를 곱해 NAV 시계열만 이어붙인다.
        run: |
          set +e
          if [ -f scripts/update_portfolio_nav.py ]; then
            python scripts/update_portfolio_nav.py --backfill 90
            echo "update_portfolio_nav: exit $?"
          else
            echo "scripts/update_portfolio_nav.py not found; skip."
          fi
          set -e

      - name: Run history analysis
        # 검증 정산(settle_pending_validations.py)·승률 갱신(update_win_rates.py)은
        # mone-settle-validations.yml로 분리됨 — cancel-in-progress 동시성 취소에 자주
        # 걸려 정산이 3주 넘게 멈췄던 적이 있어, 무거운 이 워크플로에서 떼어냄.
        run: |
          set +e
          if [ -f scripts/analyze_history.py ]; then
            python scripts/analyze_history.py
            echo "analyze_history: exit $?"
          fi
          set -e

      - name: Update pattern performance + support/resistance zones
        run: |
          set +e
          if [ -f scripts/pattern_performance_tracker.py ]; then
            python scripts/pattern_performance_tracker.py --all
            echo "pattern_performance_tracker: exit $?"
          fi
          set -e

      - name: Verify signal ledger outcomes (호라이즌별 자동 결과 검증)
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.services import signal_ledger as sl
          result = sl.verify()
          print(f"[signal_ledger] verified={result.get('verified', 0)}, skipped={result.get('skipped', 0)}")
          PY
          echo "signal_ledger verify: exit $?"
          set -e

      - name: Auto-rebuild self-correction params (샘플 30건+ 시 자동 실행)
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))

          # 검증 결과 샘플 수 확인
          from app.engine import self_correction_v2 as _scv2, correction_store
          _MIN_AUTO = 30
          all_rows = _scv2._load_validation_results("kr")
          sample_count = len(all_rows)
          print(f"[auto-correction] validation rows={sample_count}, threshold={_MIN_AUTO}")

          if sample_count < _MIN_AUTO:
              print(f"[auto-correction] 샘플 부족 ({sample_count} < {_MIN_AUTO}) — 스킵")
          else:
              old_v = correction_store.load_params().get("version", 0)
              result_kr = _scv2.build_correction_params("kr")
              new_v = result_kr.get("version", 0)
              print(f"[auto-correction] KR 보정 파라미터 재계산 완료: v{old_v} → v{new_v}, "
                    f"샘플={result_kr.get('totalSamples', 0)}")
              # US 샘플도 있으면 재계산
              us_rows = _scv2._load_validation_results("us")
              if len(us_rows) >= _MIN_AUTO:
                  result_us = _scv2.build_correction_params("us")
                  print(f"[auto-correction] US 보정 파라미터 재계산 완료: 샘플={result_us.get('totalSamples', 0)}")
          PY
          echo "auto-correction: exit $?"
          set -e

      - name: VTJ 자동 캡처 (가상 체결 기록, git 저장용)
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.services import virtual_trade_journal as vtj
          result = vtj.run_auto_capture(market="all", evaluate_after=True, source="github-actions")
          runs = result.get("runs", [])
          total_added = sum(r.get("added", 0) for r in runs)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          print(f"[vtj-capture] 총 {total_added}건 추가됨")
          PY
          echo "vtj-capture: exit $?"
          set -e

      - name: VTJ 체결 평가 (PENDING → WIN/LOSS, OHLCV 기반)
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.services import virtual_trade_journal as vtj
          result = vtj.evaluate(market="all", limit=500)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          echo "vtj-evaluate: exit $?"
          set -e

      - name: VTJ 주간 과거 리플레이 백필 (walk-forward)
        if: github.event_name == 'schedule'
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python - <<'PY'
          import sys, json
          from datetime import date, timedelta
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.services import virtual_trade_journal as vtj

          # Weekly drip: old enough to have evaluation windows, small enough to avoid overfitting bursts.
          end = date.today() - timedelta(days=120)
          start = end - timedelta(days=420)
          jobs = [
              ("kr", "balanced", "swing"),
              ("kr", "conservative", "swing"),
              ("us", "balanced", "swing"),
          ]
          results = []
          for market, mode, horizon in jobs:
              result = vtj.historical_replay_backfill(
                  market=market,
                  mode=mode,
                  horizon=horizon,
                  start_date=start.isoformat(),
                  end_date=end.isoformat(),
                  step_days=35,
                  limit=5,
                  max_runs=8,
                  evaluate_after=True,
              )
              results.append(result)
          print(json.dumps({"status": "OK", "results": results}, ensure_ascii=False, indent=2))
          PY
          echo "vtj-backfill: exit $?"
          set -e

      - name: VTJ 자가보정 (표본/한도 통과분만 자동 적용)
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.services import virtual_trade_journal as vtj
          status = vtj.self_learning_status(market="all")
          print("[vtj-self-learning/status]")
          print(json.dumps(status, ensure_ascii=False, indent=2))
          # Start new zero-capital candidates automatically and apply at most
          # one existing candidate only after its exact immutable Forward
          # promotion certificate passes. The next run's pre-generation guard
          # rolls back or quarantines degraded promoted corrections.
          result = vtj.auto_self_calibrate(market="all", applied_by="github-actions-vtj-self-learning", apply=True, max_applications=1)
          print("[vtj-self-learning/promotion-gated-auto]")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          echo "vtj-self-learning: exit $?"
          set -e

      - name: VTJ 기술지표 소급 채우기 (과거 RSI/거래량 역산)
        run: |
          set +e
          if [ -f scripts/backfill_vtj_indicators.py ]; then
            python scripts/backfill_vtj_indicators.py
            echo "backfill_vtj_indicators: exit $?"
          fi
          set -e

      - name: 팩터 귀속분석 + Kelly 포지션 사이즈 계산
        run: |
          set +e
          if [ -f scripts/factor_attribution.py ]; then
            python scripts/factor_attribution.py
            echo "factor_attribution: exit $?"
          else
            echo "scripts/factor_attribution.py not found; skip."
          fi
          set -e

      - name: 팩터 회귀 기반 필터 임계값 자동 조정
        run: |
          set +e
          if [ -f scripts/factor_filter_adjuster.py ]; then
            python scripts/factor_filter_adjuster.py
            echo "factor_filter_adjuster: exit $?"
          fi
          set -e

      - name: VTJ 귀속분석 JSON 갱신 (attribution_feedback.json)
        working-directory: mone-web-app/backend
        env:
          PYTHONPATH: .
        run: |
          set +e
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.services import virtual_trade_journal as vtj
          result = vtj.attribution_feedback(market="all")
          print("[vtj-attribution-feedback]")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          echo "vtj-attribution-feedback: exit $?"
          set -e

      # 모의투자 손절/목표가 알림 제거 (손절가 알림 제외, 장전 예측 1회만 발송)

      - name: 라이브 롤링 보정 갱신 (VTJ 실측 기반, 매 실행)
        env:
          PYTHONUTF8: "1"
        run: |
          set +e
          # 정산된 VTJ 실측(data/virtual_trade_evaluations.csv)으로 통합 롤링 보정 재생성.
          # recency 감쇠 + 백테스트 prior shrinkage → reports/live_calibration_kr.json.
          # 현재는 apply_quant_overlay에서 shadow 관측 필드로만 노출(게이트 미반영).
          python scripts/build_live_calibration.py --market kr
          echo "build_live_calibration: exit $?"
          set -e

      - name: Precompute recommendations (무거운 스코어링을 Actions에서 미리 계산)
        run: |
          set +e
          # 무료 Render(512MB)에서 실시간 추천이 90초 타임아웃·OOM을 내므로, 전 조합을
          # 여기서 미리 계산해 reports/reco_cache/*.json 으로 커밋한다(런타임은 읽기만).
          python scripts/precompute_recommendations.py --market all --limit 120
          echo "precompute recommendations: exit $?"
          set -e

      - name: Remove local token/cache files before commit
        run: |
          find . -type f \( -iname '*token_cache*.json' -o -iname '.env' -o -iname '.env.*' \) -print -delete || true
          rm -rf mone-web-app/frontend/.next mone-web-app/frontend/node_modules || true

      - name: Show generated report status
        run: |
          echo "=== KIS live refresh status ==="
          test -f reports/kis_live_refresh_status.json && cat reports/kis_live_refresh_status.json || true
          echo "=== operational readiness ==="
          test -f reports/mone_v36_operational_readiness.json && cat reports/mone_v36_operational_readiness.json || true
          echo "=== reports ==="
          ls -lah reports | tail -80 || true
          echo "=== history ==="
          ls -lah data/history || true

      - name: Commit generated data
        run: |
          bash scripts/ci_commit_app_data.sh "chore: update MONE app data reports [skip ci]" --verify-vtj

      - name: Trigger Render backend git pull (데이터 즉시 반영)
        env:
          MONE_BACKEND_URL: ${{ secrets.MONE_BACKEND_URL || 'https://agnas-stock-app.onrender.com' }}
          MONE_ADMIN_SECRET: ${{ secrets.MONE_ADMIN_SECRET }}
        run: |
          BASE="${MONE_BACKEND_URL%/}"
          echo "Render 백엔드 git pull 요청: ${BASE}/api/admin/sync-now"
          set +e
          # 데이터가 GitHub에 push된 후 Render 백엔드에 즉시 pull 요청
          curl -sf -X POST "${BASE}/api/admin/sync-now" \
            -H "Content-Type: application/json" \
            -H "x-admin-secret: ${MONE_ADMIN_SECRET}" \
            --max-time 60 \
            -o /tmp/sync_result.json && cat /tmp/sync_result.json || echo "sync-now 호출 실패 (무시)"
          set -e
          echo "Render sync 요청 완료"

      - name: VTJ 커밋 확인 (데이터 git 저장 완료)
        run: |
          echo "VTJ 체결 기록은 Actions runner에서 직접 실행 후 git에 커밋됨."
          echo "Render 백엔드는 위 sync-now 단계에서 git pull로 최신 데이터를 반영함."
          test -f data/virtual_trade_journal.csv && echo "data/virtual_trade_journal.csv 존재" || echo "data/virtual_trade_journal.csv 없음 (첫 실행 또는 캡처 없음)"
          test -f data/virtual_trade_evaluations.csv && echo "data/virtual_trade_evaluations.csv 존재" || echo "data/virtual_trade_evaluations.csv 없음"

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID 미설정 — 알림 스킵"
            exit 0
          fi
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"⚠️ MONE Auto Accumulator 실패\n워크플로: ${GITHUB_WORKFLOW}\nrun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n데이터가 갱신되지 않았을 수 있습니다 — 추천/현재가가 낡았을 위험.\"}" \
            || echo "텔레그램 알림 전송 실패 (무시)"
