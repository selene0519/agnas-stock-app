name: MONE AI Paper Trader

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to run"
        required: false
        default: "all"
        type: choice
        options:
          - kr
          - us
          - all
  schedule:
    - cron: "30 23 * * 0-4"  # KST 08:30, KR pre-market
    - cron: "0 13 * * 1-5"   # 09:00 ET during EDT
    - cron: "0 14 * * 1-5"   # 09:00 ET during EST

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: mone-ledger-writer-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "pandas>=2.2,<3" "numpy>=1.26,<3" "pandas_market_calendars>=5.3,<6" requests python-dotenv

      - name: Run one market only
        id: run
        env:
          MARKET_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.market || '' }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
        run: |
          MARKET="${MARKET_INPUT}"
          if [ -z "$MARKET" ]; then
            KR_HOUR=$(TZ=Asia/Seoul date +%H)
            ET_HOUR=$(TZ=America/New_York date +%H)
            WEEKDAY=$(date +%u)
            if [ "$WEEKDAY" -ge 6 ]; then
              echo "Weekend - skip"
              exit 0
            fi
            case "$SCHEDULE_EXPRESSION" in
              "30 23 * * 0-4")
                if [ "$KR_HOUR" != "08" ]; then
                  echo "::warning::Scheduled KR paper run started outside its safe 08:00 KST window; no paper trade was executed"
                  exit 0
                fi
                MARKET="kr" ;;
              "0 13 * * 1-5"|"0 14 * * 1-5")
                if [ "$ET_HOUR" != "09" ]; then
                  echo "Outside 09:00 ET due to daylight saving or delay - skip"
                  exit 0
                fi
                MARKET="us" ;;
              *) echo "::error::Unknown schedule; refusing an ambiguous run"; exit 1 ;;
            esac
          fi
          echo "market=${MARKET}" >> "$GITHUB_OUTPUT"
          python scripts/run_ai_paper_supervisor.py --market "$MARKET" --execute

      - name: Commit paper ledger
        run: |
          if git diff --quiet -- data/paper data/virtual_trade_evaluations.csv reports/virtual_trade_journal_status.json; then
            echo "No paper ledger changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper data/virtual_trade_evaluations.csv reports/virtual_trade_journal_status.json
          git commit -m "chore(paper): supervise ai paper survival account [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
