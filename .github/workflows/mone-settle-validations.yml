name: MONE Settle Pending Validations

on:
  workflow_dispatch:
  schedule:
    # KST 기준 (UTC+9). 가볍고 빠른 작업이라(수백 건도 1분 내) 자주 돌려도 무방.
    # mone-auto-accumulator 안에 묶여 있을 때 동시성 취소(cancel-in-progress)에
    # 자주 걸려 3주 넘게 정산이 멈춘 적이 있어 별도 워크플로로 분리.
    - cron: "0 23 * * 0-4"   # KST 08:00 (국장 개장 전)
    - cron: "0 8 * * 1-5"    # KST 17:00 (국장 마감 후)
    - cron: "0 14 * * 1-5"   # KST 23:00 (미장 개장 전후)

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: mone-settle-validations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2,<3" "numpy>=1.26,<3" 2>/dev/null || true

      - name: Settle pending validations
        run: |
          set +e
          python scripts/settle_pending_validations.py
          echo "settle_pending_validations: exit $?"
          set -e

      - name: Update strategy win rates
        run: |
          set +e
          python scripts/update_win_rates.py
          echo "update_win_rates: exit $?"
          set -e

      - name: 전략별 sleeve 자본곡선 갱신
        # 승률만으로 전략을 고르면 손익 비대칭을 놓친다. 실측(오염 구간 662건)에서
        # 승률 순위와 NAV 순위의 스피어만 상관은 -0.3이었다 — aggressive_mid는
        # 승률 1위(19.4%)인데 자본은 8위(-44.5%, 페이오프 0.59). 정산 직후에
        # 돌려야 그날 반영분이 곡선에 들어간다.
        run: |
          set +e
          python scripts/update_strategy_sleeve_nav.py
          code=$?
          set -e
          echo "update_strategy_sleeve_nav: exit ${code}"
          if [ "${code}" != "0" ]; then
            echo "::error::sleeve 자본곡선 갱신 실패(exit ${code}) — 전략 비교가 옛 데이터로 고정됩니다"
          fi

      - name: 두 원장 대조 (분모 정의 유지)
        # 추천 원장(A)과 VTJ 저널(B)은 서로 다른 모집단이다(교집합 88/854).
        # 어느 쪽이 엣지 판정의 분모이고 어느 쪽이 화면 승률의 분모인지를
        # 산출물로 남겨두지 않으면, 2026-07-28의 "승률 3배 차이" 혼란이 되풀이된다.
        run: |
          set +e
          python scripts/reconcile_ledgers.py
          echo "reconcile_ledgers: exit $?"
          python scripts/analyze_live_axes.py
          echo "analyze_live_axes: exit $?"
          set -e

      - name: 데이터 신선도 헬스게이트 + 알람 (조용한 실패 탐지)
        run: |
          set +e
          python scripts/data_freshness_healthcheck.py --max-stale-days 3
          code=$?
          set -e
          echo "data_freshness_healthcheck: exit ${code}"
          if [ "${code}" != "0" ]; then
            echo "::warning::데이터 신선도 실패 — 텔레그램 경보 전송"
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              # critical만 뽑으면 비critical ERROR(예: clean_window_samples=0,
              # 정산 적체)일 때 본문이 비어서 "무슨 일인지 없는" 알람이 간다.
              # 사유를 detail까지 붙여 그대로 보낸다.
              detail=$(python -c "import json; d=json.load(open('reports/data_freshness_status.json',encoding='utf-8')); print(' / '.join(f\"{c['name']}:{c['status']}({c.get('detail','')[:60]})\" for c in d['checks'] if c['status']!='OK') or '사유 없음')" 2>/dev/null || echo "파싱 실패")
              curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"⚠️ MONE 데이터 신선도 경보 (조용한 실패 탐지)\n${detail}\nrun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
                || echo "텔레그램 전송 실패 (무시)"
            fi
          fi

      - name: Commit validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"

            git add reports/virtual_prediction_ledger.csv reports/virtual_validation_results.csv 2>/dev/null || true
            git add reports/pending_settlement_status.json reports/strategy_win_rates.json 2>/dev/null || true
            git add reports/data_freshness_status.json 2>/dev/null || true
            # allowlist에 빠지면 스텝이 성공해도 산출물이 매번 버려진다
            # (레거시 산출물 68개가 그렇게 2개월간 조용히 사라진 전례가 있다).
            git add reports/strategy_sleeve_nav.json 2>/dev/null || true
            git add reports/ledger_reconciliation.json reports/live_axis_analysis.json 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "변경 없음 — 커밋 건너뜀"
              exit 0
            fi

            git commit -m "chore: settle pending validations + update win rates [skip ci]"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push 성공"
              exit 0
            fi
            echo "Push 충돌 재시도 (${attempt}/3)"
            sleep 5
          done

          echo "Push 실패"
          exit 1

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID 미설정 — 알림 스킵"
            exit 0
          fi
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"⚠️ MONE Settle Pending Validations 실패\nrun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n검증 정산이 멈춰 strategy_win_rates.json이 옛 데이터로 고정될 수 있습니다.\"}" \
            || echo "텔레그램 알림 전송 실패 (무시)"
